[package]
name        = "metastreams-sdk"
description = "Typed client for the Metastreams market-data API: REST reads and the /v1/stream socket."
readme      = "../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

[lints]
workspace = true

[dependencies]
metastreams-types.workspace = true

futures.workspace      = true
reqwest                = { workspace = true, features = ["query"] }
rustls                 = { workspace = true, features = ["aws-lc-rs", "std"] }
serde.workspace        = true
serde_json.workspace   = true
strum.workspace        = true
thiserror.workspace    = true
tokio.workspace        = true
# The SDK hands the connector its own rustls config, so it needs no process-wide crypto provider.
tokio-tungstenite      = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace      = true
url.workspace          = true
webpki-roots.workspace = true

[dev-dependencies]
tokio              = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "test-util"] }
wiremock.workspace = true
