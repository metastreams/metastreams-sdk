[workspace]
resolver = "3"
members  = ["metastreams-types", "metastreams-sdk"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.93"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tradeonapex/metastreams-sdk"
homepage     = "https://docs.metastreams.io"
keywords     = ["metastreams", "market-data", "solana", "evm", "websocket"]
categories   = ["api-bindings", "asynchronous"]

[workspace.lints.clippy]
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
collapsible_if            = "allow"
dbg_macro                 = "deny"
map_unwrap_or             = "deny"
rc_buffer                 = "deny"
todo                      = "deny"
uninlined_format_args     = "deny"
unreadable_literal        = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms              = { level = "deny", priority = -1 }
unused_must_use               = "deny"

[workspace.dependencies]
metastreams-types = { path = "metastreams-types", version = "0.1.0" }

bs58              = "0.5.1"
futures           = "0.3.31"
reqwest           = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_decimal      = { version = "1.41", features = ["serde-with-str", "macros", "maths"] }
rustls            = { version = "0.23.31", default-features = false }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
strum             = { version = "0.27.2", features = ["derive"] }
thiserror         = "2.0"
tokio             = { version = "1.50", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = "0.29.0"
tracing           = "0.1"
url               = "2.5.4"
utoipa            = "5.3.1"
uuid              = { version = "1.18.1", features = ["v4", "serde"] }
webpki-roots      = "1"
wiremock          = "0.6.5"
